name: CommerceIQ CI


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend-tests:

    runs-on: ubuntu-latest

    services:

      mysql:

        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_commerceiq

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    steps:

      # Checkout repository
      - name: Checkout Code

        uses: actions/checkout@v4


      # Setup Python
      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # Install dependencies
      - name: Install Backend Dependencies

        run: |

          cd backend

          pip install -r requirements.txt

          pip install pytest httpx


      # Run tests
      - name: Run Backend Tests

        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: test_commerceiq

        run: |

          cd backend

          pytest tests -v


  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4


      # Build backend Docker image
      - name: Build Backend Docker Image

        run: |

          docker build -t commerceiq-backend ./backend


      # Build frontend Docker image
      - name: Build Frontend Docker Image

        run: |

          docker build -t commerceiq-frontend ./frontend