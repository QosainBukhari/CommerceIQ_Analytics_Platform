version: '3.13'

services:

  # MySQL Database Service
  db:

    image: mysql:8.0

    container_name: commerceiq_db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: commerceiq_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  # FastAPI Backend Service
  backend:

    build: ./backend

    container_name: commerceiq_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: commerceiq_db

    volumes:
      - ./data:/app/data


  # React Frontend Service
  frontend:

    build: ./frontend

    container_name: commerceiq_frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


# Persistent MySQL Storage
volumes:

  mysql_data: